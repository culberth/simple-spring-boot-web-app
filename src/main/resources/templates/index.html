<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Preferences Demo</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="card">
    <h1>Tell Us About Yourself</h1>
    <p class="subtitle">A basic Spring Boot app showing off a few different form controls.</p>

    <form th:action="@{/submit}" th:object="${preferencesForm}" method="post">

        <div class="field">
            <label for="name">Name (text box)</label>
            <input type="text" id="name" th:field="*{name}" placeholder="Enter your name"/>
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="field">
            <label for="satisfaction">
                Satisfaction level (slider): <span id="satisfactionValue" th:text="*{satisfaction}">50</span>
            </label>
            <input type="range" id="satisfaction" th:field="*{satisfaction}" min="0" max="100" step="1"
                   oninput="document.getElementById('satisfactionValue').innerText = this.value"/>
        </div>

        <div class="field">
            <label for="favoriteColor">Favorite color (combo box)</label>
            <select id="favoriteColor" th:field="*{favoriteColor}">
                <option value="red">Red</option>
                <option value="blue">Blue</option>
                <option value="green">Green</option>
                <option value="purple">Purple</option>
                <option value="orange">Orange</option>
            </select>
        </div>

        <div class="field">
            <label>Subscription plan (radio buttons)</label>
            <div class="radio-group">
                <label class="radio-option">
                    <input type="radio" th:field="*{subscriptionPlan}" value="free"/> Free
                </label>
                <label class="radio-option">
                    <input type="radio" th:field="*{subscriptionPlan}" value="pro"/> Pro
                </label>
                <label class="radio-option">
                    <input type="radio" th:field="*{subscriptionPlan}" value="enterprise"/> Enterprise
                </label>
            </div>
        </div>

        <div class="field checkbox-field">
            <input type="checkbox" id="newsletter" th:field="*{newsletter}"/>
            <label for="newsletter">Subscribe to newsletter (checkbox)</label>
        </div>

        <div class="field checkbox-field">
            <input type="checkbox" id="darkMode" th:field="*{darkMode}"/>
            <label for="darkMode">Enable dark mode (checkbox)</label>
        </div>

        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
